name: secret-scan

# Privy's security checklist asks for credential scanning, and the two formats it names are distinctive
# enough to grep for exactly. Runs over TRACKED files only, so a local .env can never trip it, and the
# placeholder forms in .env.example (suiprivkey1..., privy...) do not match the length floors below.

on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for committed credentials
        run: |
          set -euo pipefail
          patterns='privy_app_secret_[A-Za-z0-9]{16,}|wallet-auth:[A-Za-z0-9+/]{16,}|suiprivkey1[a-z0-9]{40,}'
          if git grep -nIE "$patterns" -- . ':!.github/workflows/secret-scan.yml'; then
            echo "::error::A credential matching a Privy app secret, a Privy authorization key, or a Sui private key is committed. Rotate it, then remove it from the tree."
            exit 1
          fi
          echo "No committed credentials found."
